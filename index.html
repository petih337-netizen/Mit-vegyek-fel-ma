<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251d">
<title>Találtam! – Elveszett és megtalált tárgyak</title>
<meta name="description" content="Elveszett vagy talált tárgyak keresése és bejelentése egy helyen.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0d1914;
  --panel:#14271e;
  --panel2:#1a3327;
  --green:#b5d5a3;
  --gold:#e7c879;
  --text:#f3f4ed;
  --muted:#aab8ad;
  --border:rgba(255,255,255,.1);
  --danger:#f08d82;
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(ellipse at 15% 0%,rgba(76,125,84,.22),transparent 40%),
  radial-gradient(ellipse at 90% 35%,rgba(190,155,75,.10),transparent 35%),
  var(--bg);
  color:var(--text);font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(13,25,20,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav{
  max-width:1150px;margin:auto;padding:15px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.logo{font-size:25px;font-weight:800;color:var(--gold)}
.logo span{color:var(--green)}
.nav-actions{display:flex;gap:8px;flex-wrap:wrap}
.container{max-width:1100px;margin:auto;padding:25px 20px}
.hero{
  padding:55px 25px;text-align:center;border:1px solid var(--border);
  border-radius:24px;background:linear-gradient(135deg,#193528,#14251e 70%);
  box-shadow:0 15px 50px rgba(0,0,0,.2);
}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 14px}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);line-height:1.6;max-width:650px;margin:0 auto 24px}
.btn{
  border:0;border-radius:12px;padding:12px 17px;font-weight:700;
  background:var(--green);color:#14251b;
}
.btn:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.danger{background:#633a35;color:white}
.btn.small{padding:8px 11px;font-size:13px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 16px}
.section-title h2{margin:0;font-size:23px}
.muted{color:var(--muted)}
.filters,.form-card,.account-card,.message-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:17px;padding:18px;
}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
input,textarea,select{
  width:100%;padding:12px;border-radius:10px;
  border:1px solid var(--border);background:#0e1c15;color:var(--text);
  outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.listings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.listing{
  overflow:hidden;background:var(--panel);border:1px solid var(--border);
  border-radius:17px;display:flex;flex-direction:column;
}
.listing img{width:100%;height:190px;object-fit:cover;background:#20372a}
.listing-content{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
.tag{
  display:inline-block;padding:5px 9px;border-radius:20px;
  background:#294533;color:var(--green);font-size:11px;font-weight:bold;
}
.tag.lost{background:#4a3930;color:#f0c38a}
.listing h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.listing p{margin:0;color:var(--muted);line-height:1.5;font-size:14px;overflow-wrap:anywhere}
.listing-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hidden{display:none!important}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;
  display:flex;align-items:center;justify-content:center;padding:15px;
}
.modal-box{
  width:100%;max-width:480px;max-height:90vh;overflow:auto;
  background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:23px;
}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0}
.close{background:none;border:0;color:var(--text);font-size:25px}
.notice{
  margin:12px 0;padding:12px;border-radius:10px;
  background:#263c2c;color:var(--green);font-size:14px;
}
.notice.error{background:#472b29;color:#ffb5a9}
.account-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;padding:15px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;margin-top:20px;
}
