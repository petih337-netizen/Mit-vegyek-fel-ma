<script>
const $ = id => document.getElementById(id);

let requestNumber = 0;
let selectedCoordinates = [47.4979, 19.0402];
let selectedCity = "Budapest";
let refreshTimer;

function clothingAdvice(temp, rain) {
  let advice;

  if (temp < 5) {
    advice = "Meleg kabát, pulóver, sál és zárt cipő";
  } else if (temp < 13) {
    advice = "Pulóver, átmeneti kabát és hosszú nadrág";
  } else if (temp < 21) {
    advice = "Réteges felső és könnyű kabát";
  } else {
    advice = "Póló, könnyű nadrág és szellős cipő";
  }

  if (rain >= 50) advice += " · Esőkabát vagy esernyő";
  return advice;
}

function getWeatherIcon(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "🌤️";
  if (code <= 3) return "☁️";
  if (code <= 48) return "🌫️";
  if (code <= 67) return "🌧️";
  if (code <= 77) return "❄️";
  if (code <= 82) return "🌦️";
  return "⛈️";
}

function updateOutfit(temp, rain, wind) {
  let items, tag, tip;

  if (temp < 5) {
    items = [
      ["🧥","Meleg télikabát","Szélálló, bélelt kabát"],
      ["🧣","Sál és meleg réteg","Pulóver vagy vastag felső"],
      ["👖","Vastag hosszú nadrág","Hidegben kényelmesebb"],
      ["🥾","Meleg, zárt cipő","Lehetőleg vízálló"]
    ];
    tag = "Hideg idő";
    tip = "Öltözz melegen, több rétegben. A sapka és kesztyű is jól jöhet.";
  } else if (temp < 13) {
    items = [
      ["🧶","Melegebb pulóver","Hosszú ujjú alapréteg"],
      ["🧥","Melegebb kabát","Átmeneti vagy bélelt"],
      ["👖","Hosszú nadrág","Farmer vagy vastagabb anyag"],
      ["👟","Zárt cipő","Kényelmes utcai cipő"]
    ];
    tag = "Hűvös idő";
    tip = "Reggel és este hűvösebb lehet, ezért vigyél magaddal kabátot.";
  } else if (temp < 21) {
    items = [
      ["👕","Hosszú ujjú felső","Vékony pulóver is jó lehet"],
      ["🧥","Könnyű kabát","Rétegesen könnyű alkalmazkodni"],
      ["👖","Hosszú nadrág","Kényelmes, szellős anyag"],
      ["👟","Zárt cipő","Sportcipő vagy vászoncipő"]
    ];
    tag = "Enyhe idő";
    tip = "A réteges öltözködés jó választás.";
  } else {
    items = [
      ["👕","Könnyű póló","Légáteresztő anyag"],
      ["🧢","Nap elleni kiegészítő","Sapka vagy napszemüveg"],
      ["🩳","Könnyű nadrág","Rövid vagy vékony hosszú nadrág"],
      ["👟","Szellős lábbeli","Kényelmes, könnyű cipő"]
    ];
    tag = "Meleg idő";
    tip = "Válassz világos, könnyű ruhákat, és gondolj a napvédelemre.";
  }

  if (rain >= 50) {
    items[1] = ["🌂","Esőkabát vagy esernyő","Készülj a csapadékra"];
    items[3] = ["🥾","Vízálló cipő","Kerüld az átázó lábbelit"];
    tip += " Eső miatt vízálló felsőréteg ajánlott.";
  }

  if (wind >= 35) {
    tip += " Erős szél várható, ezért szélálló kabátot válassz.";
  }

  $("weatherTag").textContent = tag;
  $("tipText").textContent = tip;
  $("outfit").innerHTML = items.map(item => `
    <div class="item">
      <div class="emoji">${item[0]}</div>
      <b>${item[1]}</b>
      <span>${item[2]}</span>
    </div>
  `).join("");
}

function renderForecast(data) {
  const h = data.hourly;
  const currentTime = data.current.time;
  const currentIndex = h.time.findIndex(t => t >= currentTime);
  const today = currentTime.slice(0, 10);

  const periods = [
    {name:"🌅 Reggel",start:6,end:9},
    {name:"☀️ Délelőtt",start:9,end:12},
    {name:"🌤️ Délután",start:12,end:18},
    {name:"🌙 Este",start:18,end:23}
  ];

  $("hourlyForecast").innerHTML = periods.map(period => {
    const indices = h.time.map((t,i) => {
      const hour = Number(t.slice(11,13));
      return t.startsWith(today) &&
        hour >= period.start && hour < period.end ? i : -1;
    }).filter(i => i >= 0);

    if (!indices.length) {
      return `<div class="period-card">${period.name}: nincs adat.</div>`;
    }

    const temps = indices.map(i => h.apparent_temperature[i]);
    const rain = Math.max(...indices.map(i =>
      h.precipitation_probability[i] || 0
    ));
    const average = temps.reduce((a,b) => a+b,0) / temps.length;

    return `
      <div class="period-card">
        <div class="period-head">
          <h3>${period.name}</h3>
          <span class="period-meta">${period.start}:00–${period.end}:00</span>
        </div>
        <b>${Math.round(Math.min(...temps))}–${Math.round(Math.max(...temps))}°C</b>
        · Eső esélye: ${rain}%
        <div class="period-advice">
          👕 ${clothingAdvice(average,rain)}
        </div>
      </div>
    `;
  }).join("");

  $("hourList").innerHTML = h.time
    .map((time,i) => ({time,i}))
    .filter(x => x.time.startsWith(today) && x.i >= currentIndex)
    .slice(0,12)
    .map(x => `
      <div class="period-card">
        <div class="period-head">
          <h3>${x.time.slice(11,16)}</h3>
          <b>${Math.round(h.temperature_2m[x.i])}°C</b>
        </div>
        Hőérzet: ${Math.round(h.apparent_temperature[x.i])}°C
        · Eső: ${h.precipitation_probability[x.i] ?? 0}%
      </div>
    `).join("");
}

async function findCity(name) {
  const url = "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(name) + "&count=5&language=hu&format=json";

  const response = await fetch(url);
  if (!response.ok) throw new Error("A település keresése nem sikerült.");

  const data = await response.json();
  if (!data.results || !data.results.length) {
    throw new Error("Nem találom ezt a települést.");
  }

  return data.results[0];
}

// ÚJ: GPS Koordinátákból visszakeresi a legközelebbi településnevet
async function getCityFromCoords(lat, lon) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1&language=hu&format=json`;
    const response = await fetch(url);
    if (!response.ok) return null;
    const data = await response.json();
    if (data.results && data.results.length > 0) {
      return data.results[0].name;
    }
  } catch (e) {
    console.warn("Reverse geocoding hiba:", e);
  }
  return null;
}

async function loadWeather(coords, cityName) {
  const thisRequest = ++requestNumber;
  $("status").textContent = "Időjárási adatok lekérése...";
  $("refresh").disabled = true;

  try {
    const url =
      `https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}` +
      `&longitude=${coords[1]}` +
      "&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
      "&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation" +
      "&forecast_days=2&timezone=auto";

    const response = await fetch(url);
    if (!response.ok) throw new Error("Az időjárási szolgáltatás nem elérhető.");

    const data = await response.json();

    if (thisRequest !== requestNumber) return;

    const current = data.current;
    const timeIndex = data.hourly.time.indexOf(current.time);

    const rain = timeIndex >= 0
      ? (data.hourly.precipitation_probability[timeIndex] ?? 0)
      : 0;

    const temp = current.temperature_2m;
    const feels = current.apparent_temperature;
    const wind = current.wind_speed_10m;

    $("tempDisplay").textContent = Math.round(temp) + "°";
    $("feelsDisplay").textContent = Math.round(feels) + "°";
    $("rainDisplay").textContent = rain + "%";
    $("cityDisplay").textContent = cityName;
    $("weatherIcon").textContent = getWeatherIcon(current.weather_code);

    updateOutfit(feels, rain, wind);
    renderForecast(data);

    selectedCoordinates = coords;
    selectedCity = cityName;

    $("status").textContent =
      "Frissítve: " +
      new Date(current.time).toLocaleString("hu-HU") +
      " · Szél: " + Math.round(wind) + " km/h · Open-Meteo";

  } catch (error) {
    if (thisRequest === requestNumber) {
      $("status").textContent = "Hiba: " + error.message +
        " Ellenőrizd az internetkapcsolatot.";
    }
  } finally {
    if (thisRequest === requestNumber) {
      $("refresh").disabled = false;
    }
  }
}

let cityTimer;

async function changeCity() {
  const name = $("city").value.trim();
  if (name.length < 2) return;

  clearTimeout(cityTimer);

  cityTimer = setTimeout(async () => {
    try {
      $("status").textContent = "Település keresése...";
      const result = await findCity(name);

      $("city").value = result.name;

      const displayName = [
        result.name,
        result.admin1,
        result.country
      ].filter(Boolean).join(", ");

      await loadWeather(
        [result.latitude,result.longitude],
        displayName
      );
    } catch (error) {
      $("status").textContent = error.message;
    }
  }, 700);
}
